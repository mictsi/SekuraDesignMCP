version: 2

# Two ecosystems below carry `ignore` rules for major updates. That is not
# reluctance to upgrade — npm and Actions majors are taken freely. It is that
# the Node runtime major is a *policy* decision, and Dependabot has no way to
# know the policy.
#
# The supported LTS window is Node 22 and 24. Dependabot offered
# `node:25-alpine` and `@types/node@26` while neither was an LTS line.
# Node's release policy changes with version 27, so review the window against
# the official release schedule rather than inferring LTS status from parity.
#
# `npm run check:deps` enforces the current window as a build gate, so a major that
# arrives by some other route still fails the build rather than shipping.

updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine noise; anything major still comes separately so
      # it gets read.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # The types must describe the runtime we actually ship on, so this major
      # moves when the Dockerfile's Node major moves, and not before. Minor and
      # patch updates within the line are still proposed.
      # Angular 21 is the newest LTS line; 22 remains in Active support.
      - dependency-name: '@angular/*'
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    ignore:
      # Moving Node major is a deliberate decision recorded in the CHANGELOG,
      # taken when a line reaches LTS or leaves maintenance — not when a new
      # tag appears. Patch and minor tags within the line are still proposed.
      - dependency-name: node
        update-types: [version-update:semver-major]
    labels: [dependencies, docker]
