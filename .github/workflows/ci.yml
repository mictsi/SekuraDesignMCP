name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: Build gates (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # Exactly the Node LTS lines the project claims to support, so
        # `engines: >=22` is verified rather than aspirational. 24 (Krypton) is
        # active LTS and what the container builds on; 22 (Jod) is maintenance.
        node: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Compile
        run: npm run build

      # Every step below is a gate, not a report. Each exits non-zero on
      # failure, so an artefact that breaks a promise is never produced.

      - name: Version consistency
        run: npm run check:version

      - name: Dependency policy
        # No pre-release dependencies anywhere in the tree, and every Node
        # reference is an even-numbered LTS line. This is what stops a
        # well-meaning bot moving the runtime to a major that never gets LTS.
        run: npm run check:deps

      - name: Environment documentation
        # .env.example must document every setting the code reads, and list none
        # it does not. It is the only place a deployer looks.
        run: npm run check:env

      - name: URL resolution
        # Path prefixes, stripped prefixes and forwarded headers, which are the
        # deployments that cannot be tried by hand.
        run: npm run test:urls

      - name: Colour maths reference test
        # The whole system rests on contrastRatio being right, so it is checked
        # against WCAG reference values rather than trusted.
        run: npm run test:color

      - name: Contrast audit
        # 78 declared pairings x 4 themes. The colour system's central claim.
        run: npm run audit:contrast

      - name: CSS structural lint
        # Component CSS is a string to the compiler, so it gets its own check:
        # balanced braces, no selector running into an at-rule, no hard-coded
        # colours, no unknown tokens, no physical properties.
        run: npm run lint:css

      - name: Tool error contract
        # Every failing tool call must be marked isError with a semantic code,
        # a standard recovery hint and the closest valid values. A friendly
        # sentence in a success envelope is what makes a model hallucinate.
        run: npm run test:errors

      - name: MCP smoke test
        # Exercises every tool, component, framework and export format through a
        # real MCP client.
        run: npm run smoke

      - name: Build behaviour package
        run: npm run build:behaviours

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Generated framework recipes
        run: npm run test:codegen && npm run test:blazor

      - name: Install Chromium
        # Needed by the behaviour and accessibility checks below, which drive a
        # real browser rather than a DOM emulation.
        run: npx playwright install --with-deps chromium

      - name: Behaviour contracts
        # Real key presses against a real DOM: roving tabindex, focus trap and
        # restore, aria-activedescendant, Escape handling, inert on close.
        run: npm run test:behaviours

      - name: Emit stylesheets
        run: npm run emit:css

      - name: Build documentation site
        run: npm run site:build

      - name: Verify documentation site
        # Dangling ARIA references, missing icons, broken links, duplicate ids,
        # hard-coded colours, then the design system's own markup linter.
        run: npm run verify:sample

      - name: Static bundle is portable
        # Produces dist-site/ and refuses if anything is root-absolute — the
        # failure that works at a domain root and 404s in a subdirectory.
        run: npm run site:publish

      - name: Design and example regressions
        run: npm run test:design

      - name: RTL regression
        # Logical properties are claimed to make RTL work with no extra CSS.
        # This drives the built site, so it runs after site:build — running it
        # earlier tested whatever the previous build happened to leave behind.
        run: npm run test:rtl

      - name: Upload artefacts
        # Only from the LTS line the container is built on — two identical
        # uploads would collide on the artefact name.
        if: always() && matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            dist-css/
            dist-js/
          retention-days: 7

  accessibility:
    name: Accessibility (axe-core)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: gates

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run emit:css
      - run: npm run build:behaviours
      - run: npm run site:build
      - run: npx playwright install --with-deps chromium

      - name: axe-core — WCAG 2.0/2.1/2.2 A + AA
        # Both themes, because a dark-mode contrast failure is invisible to a
        # light-mode-only scan.
        run: npm run test:a11y

      - name: Accessible names
        # Name uniqueness within a region, which axe does not check. It is the
        # failure that turns a column of row actions into "Inspect, Inspect,
        # Inspect". NOT a screen reader test — see the script's header.
        run: npm run test:announce

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: gates

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: sekura-design-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Health check
        # /health re-runs the contrast audit inside the container, so this
        # verifies the running image, not just that it starts.
        run: |
          docker run -d --name sekura -p 8080:8080 sekura-design-mcp:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health > /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          node -e "
            const h = require('/tmp/health.json');
            if (h.status !== 'ok') { console.error('unhealthy'); process.exit(1); }
            if (!h.contrastAudit.passing) { console.error('contrast audit failing in image'); process.exit(1); }
            console.log('Image healthy:', h.contentCounts.components, 'components');
          "

      - name: MCP protocol check
        run: |
          curl -fsS -X POST http://127.0.0.1:8080/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | node -e "
              let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                const n=JSON.parse(s).result.tools.length;
                if(n<14){console.error('only '+n+' tools');process.exit(1);}
                console.log(n+' tools exposed');
              });"

      - name: Published under a path prefix
        # The same image mounted at /design-system. Everything must move with
        # the prefix, and generated links must carry it.
        run: |
          docker run -d --name sekura-prefixed -p 8081:8080 \
            -e SEKURA_BASE_PATH=/design-system sekura-design-mcp:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/design-system/health > /dev/null; then break; fi
            sleep 1
          done
          for p in /design-system/health /design-system/manifest.json \
                   /design-system/tokens.css /design-system/css/sekura.css \
                   /design-system/js/sekura.iife.min.js /design-system/docs/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8081$p")
            echo "$p -> $code"
            [ "$code" = "200" ] || { echo "::error::$p returned $code under the prefix"; exit 1; }
          done
          # Nothing may answer outside the app path — including the root, which
          # used to redirect. Two addresses for one deployment is how a link
          # ends up pointing at the one that is not the real one.
          for p in / /health /docs/ /mcp /manifest.json /css/sekura.css; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8081$p")
            [ "$code" = "404" ] || { echo "::error::$p answers outside the app path ($code)"; exit 1; }
          done
          echo "nothing is served outside /design-system"
          curl -fsS http://127.0.0.1:8081/design-system/manifest.json | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const m=JSON.parse(s);
              for(const [k,v] of Object.entries(m.artefacts)){
                if(!String(v.url).includes('/design-system')){
                  console.error('artefact '+k+' lost the prefix: '+v.url); process.exit(1);
                }
              }
              console.log('all '+Object.keys(m.artefacts).length+' artefact URLs carry the prefix');
            });"

      - name: Configured entirely from .env
        # The documented path: copy the sample, edit it, --env-file it. Also
        # asserts the three endpoints share one port and one app path, which is
        # the whole point of the base-path support.
        run: |
          cp .env.example .env
          sed -i 's|^SEKURA_BASE_PATH=/$|SEKURA_BASE_PATH=/from-env|' .env
          docker run -d --name sekura-envfile -p 8083:8080 --env-file .env sekura-design-mcp:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8083/from-env/health > /dev/null; then break; fi
            sleep 1
          done
          for p in /from-env/health /from-env/docs/ /from-env/manifest.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8083$p")
            echo "GET $p -> $code"
            [ "$code" = "200" ] || { echo "::error::$p returned $code"; exit 1; }
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8083/from-env/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          echo "POST /from-env/mcp -> $code"
          [ "$code" = "200" ] || { echo "::error::MCP returned $code from .env config"; exit 1; }
          rm -f .env

      - name: External URL overrides a stripped prefix
        # The proxy_pass-strips-the-prefix case: the app listens at the root but
        # every link it generates must be the public one.
        run: |
          docker run -d --name sekura-external -p 8082:8080 \
            -e SEKURA_EXTERNAL_URL=https://example.com/design-system sekura-design-mcp:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8082/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8082/manifest.json | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const m=JSON.parse(s);
              if(m.base!=='https://example.com/design-system'){
                console.error('base is '+m.base); process.exit(1);
              }
              const leaked=Object.entries(m.artefacts).filter(([,v])=>/127\.0\.0\.1|localhost/.test(v.url));
              if(leaked.length){console.error('internal host leaked: '+JSON.stringify(leaked));process.exit(1);}
              console.log('links are public; no internal host leaked');
            });"

      - name: Container logs on failure
        if: failure()
        run: |
          docker logs sekura || true
          docker logs sekura-prefixed || true
          docker logs sekura-external || true
          docker logs sekura-envfile || true
