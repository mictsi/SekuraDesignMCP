name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v1.1.0'
        required: true

permissions:
  contents: write   # create the release
  packages: write   # push to GHCR

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a half-finished release

jobs:
  verify:
    name: Verify before releasing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Resolve and check version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"

          echo "tag:         $TAG_VERSION"
          echo "package.json: $PKG_VERSION"

          # A tag that disagrees with package.json produces artefacts labelled
          # with one version and containing another. Refuse rather than guess.
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match package.json $PKG_VERSION. Bump package.json and re-tag."
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install browser engines
        run: node node_modules/playwright-core/cli.js install --with-deps chromium firefox webkit

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run every gate
        # The same chain CI runs. A release must not be able to skip a check.
        run: npm run verify

      - name: Package artefacts
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release

          # 1. Stylesheets — the primary artefact for a consumer with no build step.
          (cd dist-css && zip -qr "../release/sekura-css-$VERSION.zip" .)

          # 2. Behaviours — the framework-agnostic keyboard/ARIA implementation.
          (cd dist-js && zip -qr "../release/sekura-behaviours-$VERSION.zip" .)

          # 3. Documentation site, so it can be hosted anywhere.
          (cd sample && zip -qr "../release/sekura-docs-$VERSION.zip" . -x 'pages/*')

          # 4. Loose token files, for pipelines that want one file rather than a zip.
          cp dist-css/tokens.css            "release/tokens-$VERSION.css"
          cp dist-css/tokens.dtcg.json      "release/tokens-$VERSION.dtcg.json"
          cp dist-css/sekura.css            "release/sekura-$VERSION.css"
          cp dist-js/sekura.iife.min.js     "release/sekura-behaviours-$VERSION.iife.min.js"
          cp dist-js/sekura.esm.min.js      "release/sekura-behaviours-$VERSION.esm.min.js"

          # 5. npm tarball for the behaviours package.
          (cd dist-js && npm pack --pack-destination ../release >/dev/null)

          # Native React package and editable design-tool starter library.
          (cd dist-react && npm pack --pack-destination ../release >/dev/null)
          (cd dist-design-kit && zip -qr "../release/sekura-design-kit-$VERSION.zip" .)

          # Checksums, so a consumer can verify what they downloaded.
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release

      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: release/
          retention-days: 30

  image:
    name: Publish container image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [verify, image]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # for the changelog diff

      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: release

      - name: Compose release notes
        id: notes
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          {
            echo "## Sekura Design System v$VERSION"
            echo ""
            echo "### Verified before release"
            echo ""
            echo "Every gate below ran and passed. A release cannot skip them."
            echo ""
            echo "| Gate | What it checks |"
            echo "|---|---|"
            echo "| Contrast audit | Every declared colour pairing, in all four themes |"
            echo "| CSS lint | Structure, tokens only, no physical properties |"
            echo "| MCP smoke | Every tool, component, framework and export format |"
            echo "| Behaviour tests | Real key presses: focus, ARIA, Escape, inert |"
            echo "| Site verification | Dangling references, links, markup lint |"
            echo "| Image health | \`/health\` re-runs the contrast audit in the container |"
            echo ""
            echo "### Artefacts"
            echo ""
            echo "| File | Use |"
            echo "|---|---|"
            echo "| \`sekura-$VERSION.css\` | The whole stylesheet, one file |"
            echo "| \`tokens-$VERSION.css\` | Custom properties only, all themes and densities |"
            echo "| \`tokens-$VERSION.dtcg.json\` | W3C Design Tokens format |"
            echo "| \`sekura-behaviours-$VERSION.iife.min.js\` | Drop-in \`<script>\`, global \`Sekura\` |"
            echo "| \`sekura-behaviours-$VERSION.esm.min.js\` | ES module for bundlers |"
            echo "| \`sekura-css-$VERSION.zip\` | All stylesheets, per-component files, native exports |"
            echo "| \`sekura-docs-$VERSION.zip\` | The documentation site, host it anywhere |"
            echo "| \`SHA256SUMS.txt\` | Checksums |"
            echo ""
            echo "### Container"
            echo ""
            echo '```bash'
            echo "docker run -d -p 8080:8080 ghcr.io/${{ github.repository }}:$VERSION"
            echo '```'
            echo ""
            if [ -f CHANGELOG.md ]; then
              echo "### Changes"
              echo ""
              # The section for this version, up to the next heading.
              awk "/^## \[?$VERSION\]?/{flag=1;next}/^## /{flag=0}flag" CHANGELOG.md
            fi
          } > notes.md
          cat notes.md

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          body_path: notes.md
          draft: false
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}
          generate_release_notes: true

  pages:
    name: Deploy documentation
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build && npm run build:behaviours && npm run emit:css && npm run site:build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: sample
      - id: deploy
        uses: actions/deploy-pages@v5
