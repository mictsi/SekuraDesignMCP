name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v3.2.0'
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve existing release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Resolve tag and verify its package version
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node src/scripts/resolve-release.mjs

  verify:
    name: Verify release commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: resolve
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install browser engines
        run: node node_modules/playwright-core/cli.js install --with-deps chromium firefox webkit
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Run every gate
        run: npm run verify
      - name: Package verified artefacts
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          mkdir -p release
          (cd dist-css && zip -qr "../release/sekura-css-$VERSION.zip" .)
          (cd dist-js && zip -qr "../release/sekura-behaviours-$VERSION.zip" .)
          (cd dist-site && zip -qr "../release/sekura-docs-$VERSION.zip" .)
          cp dist-css/tokens.css "release/tokens-$VERSION.css"
          cp dist-css/tokens.dtcg.json "release/tokens-$VERSION.dtcg.json"
          cp dist-css/sekura.css "release/sekura-$VERSION.css"
          cp dist-js/sekura.iife.min.js "release/sekura-behaviours-$VERSION.iife.min.js"
          cp dist-js/sekura.esm.min.js "release/sekura-behaviours-$VERSION.esm.min.js"
          (cd dist-js && npm pack --pack-destination ../release >/dev/null)
          (cd dist-react && npm pack --pack-destination ../release >/dev/null)
          (cd dist-design-kit && zip -qr "../release/sekura-design-kit-$VERSION.zip" .)
          node -e 'require("fs").writeFileSync("release/SOURCE.json", JSON.stringify({version:process.env.VERSION, commit:process.env.RELEASE_SHA}, null, 2) + "\n")'
          (cd release && sha256sum * > SHA256SUMS.txt)
          # The image consumes these exact assets. Dependencies install per architecture.
          tar --transform='s|^dist-site|sample|' -czf release-runtime.tgz package.json package-lock.json dist dist-css dist-js dist-site
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: release/
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: release-runtime
          path: release-runtime.tgz
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: release-site
          path: dist-site/
          retention-days: 30

  image:
    name: Verify and publish container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [resolve, verify]
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: release-runtime
          path: verified
      - name: Extract verified runtime context
        run: |
          mkdir release-runtime
          tar -xzf verified/release-runtime.tgz -C release-runtime
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Release metadata from the resolved tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.resolve.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve.outputs.tag }},enable=${{ !contains(needs.resolve.outputs.version, '-') }}
            type=semver,pattern={{major}},value=${{ needs.resolve.outputs.tag }},enable=${{ !contains(needs.resolve.outputs.version, '-') }}
            type=raw,value=latest,enable=${{ !contains(needs.resolve.outputs.version, '-') }}
      - name: Build candidate from verified artefacts
        id: build
        uses: docker/build-push-action@v7
        with:
          context: release-runtime
          file: Dockerfile
          build-args: SEKURA_ARTIFACT_STAGE=verified
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.name.outputs.image }}:verification-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Probe the exact image digest on both platforms
        env:
          RELEASE_IMAGE: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: node src/scripts/test-release-image.mjs
      - name: Promote the verified digest to release tags
        env:
          RELEASE_IMAGE: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          RELEASE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          TAG_ARGS=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then TAG_ARGS+=(--tag "$tag"); fi
          done <<< "$IMAGE_TAGS"
          docker buildx imagetools create --metadata-file promotion.json "${TAG_ARGS[@]}" "$RELEASE_IMAGE"
          node -e 'const m=require("./promotion.json"); if(m["containerimage.descriptor"]?.digest!==process.env.RELEASE_DIGEST) throw new Error("Promoted digest differs from the verified image")'
      - uses: actions/upload-artifact@v7
        with:
          name: release-image-verification
          path: release-image-verification.json
          retention-days: 30

  publish:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [resolve, verify, image]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: release-image-verification
          path: release
      - name: Compose release notes
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_IMAGE: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
        run: |
          (cd release && sha256sum --check SHA256SUMS.txt)
          (cd release && sha256sum release-image-verification.json >> SHA256SUMS.txt)
          {
            echo "## Sekura Design System v$VERSION"
            echo ""
            echo "Source commit: $RELEASE_SHA"
            echo ""
            echo "### Verification completed for this release"
            echo ""
            echo "The verification job passed npm run verify against the commit above."
            echo "The container job checked health, release version, assets and MCP on linux/amd64 and linux/arm64 using the digest below."
            echo "The documentation archive and Pages deployment reuse the verified dist-site artifact."
            echo ""
            echo "### Container"
            echo ""
            echo '```bash'
            echo "docker run -d -p 8080:8080 $RELEASE_IMAGE"
            echo '```'
            echo ""
            echo "Download the CSS, behaviours, React, design-kit and documentation archives below. SOURCE.json records the source commit; SHA256SUMS.txt covers every download."
            echo "See release-image-verification.json for the image checks."
            echo ""
            if [ -f CHANGELOG.md ]; then
              echo "### Changes"
              echo ""
              awk -v version="$VERSION" '/^## / { active = index($0, "[" version "]") > 0 || index($0, "## " version " ") == 1; next } active { print }' CHANGELOG.md
            fi
          } > notes.md
      - name: Publish resolved tag
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.sha }}
          files: release/*
          body_path: notes.md
          draft: false
          prerelease: ${{ contains(needs.resolve.outputs.version, '-') }}
          generate_release_notes: true

  pages:
    if: ${{ !contains(needs.resolve.outputs.version, '-') }}
    name: Deploy verified documentation
    runs-on: ubuntu-latest
    needs: [resolve, verify, publish]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-site
          path: dist-site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-site
      - id: deploy
        uses: actions/deploy-pages@v5
