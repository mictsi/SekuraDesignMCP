services:
  sekura-design-mcp:
    build:
      context: .
      target: runtime
    # Tag follows package.json; override with SEKURA_VERSION.
    image: ${SEKURA_IMAGE:-sekura-design-mcp}:${SEKURA_VERSION:-latest}
    container_name: ${SEKURA_CONTAINER:-sekura-design-mcp}
    restart: unless-stopped
    ports:
      - "${SEKURA_PORT:-8080}:8080"
    # Every setting lives in .env — copy .env.example to start.
    #
    # `required: false` so `docker compose up` works on a fresh clone with no
    # .env at all; the Dockerfile's ENV defaults then apply. Compose also reads
    # this same file for ${...} interpolation below, so the host port and the
    # image tag come from it too.
    env_file:
      - path: .env
        required: false

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const b=(process.env.SEKURA_BASE_PATH||'').replace(/\\/+$/,'');fetch('http://127.0.0.1:8080'+b+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # The design system is read-only at runtime, so the container needs no
    # writable filesystem and no extra capabilities.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
